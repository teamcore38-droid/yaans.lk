name: Marketplace quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Marketplace verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm --prefix backend ci --no-audit --no-fund
          npm --prefix frontend ci --include=dev --no-audit --no-fund
      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-test-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Check preinstalled Chrome
        run: google-chrome --version
      - name: Verify Node, React, MongoDB, build and browser journeys
        env:
          YAANS_TEST_BROWSER_CHANNEL: chrome
        run: npm run verify
      - name: Retain test reports and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-test-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
