server {
    listen 80;
    server_name yaans.lk www.yaans.lk;

    root /var/www/yaans.lk/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Cache static Vite assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /brand/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Proxy REST API calls to Express backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy local image uploads when Cloudinary is in fallback mode
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        expires 30d;
    }

    # SPA Client-Side Routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
