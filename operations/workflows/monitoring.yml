name: Website and checkout monitoring

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: operations-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require private operational alerts
        env:
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: test "$PRIVATE_REPOSITORY" = true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check readiness, checkout/database errors and backup freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MONITORING_TOKEN: ${{ secrets.MONITORING_TOKEN }}
          PRODUCTION_ORIGIN: https://yaans.lk
        run: node scripts/monitor.mjs
      - name: Record or resolve the private operational alert
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: node scripts/report-alert.mjs monitoring "$JOB_STATUS"
