name: Automated MongoDB Database Backup

on:
  # Runs every night at 18:30 UTC = 00:00 (Midnight) Sri Lanka Time (SLST / UTC+5:30)
  schedule:
    - cron: '30 18 * * *'

  # Allows manual backup trigger directly from GitHub web interface anytime
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create permanent GitHub Release asset'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  backup:
    name: Backup MongoDB Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        run: |
          npm --prefix backend install --omit=dev --no-audit --no-fund

      - name: Run MongoDB Backup Script
        id: run_backup
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME || 'yaans_lk' }}
        run: |
          node backend/scripts/backup_db.js --out=backups

      - name: Compress Backup Archive
        id: compress
        run: |
          cd backups
          # Find latest generated json file
          LATEST_FILE=$(ls -t yaans_backup_*.json | head -n 1)
          TIMESTAMP=$(echo "$LATEST_FILE" | sed -E 's/yaans_backup_(.*)\.json/\1/')
          ZIP_NAME="yaans_backup_${TIMESTAMP}.zip"
          zip -9 "$ZIP_NAME" "$LATEST_FILE"
          
          echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "ZIP_PATH=backups/${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload Backup to GitHub Artifacts (90 Days Retention)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 90
          if-no-files-found: error

      - name: Create Permanent GitHub Release Snapshot
        if: ${{ github.event.inputs.create_release != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="backup-${{ env.TIMESTAMP }}"
          echo "Creating Release with tag $TAG_NAME..."
          gh release create "$TAG_NAME" "${{ env.ZIP_PATH }}" \
            --title "Database Backup: ${{ env.TIMESTAMP }}" \
            --notes "Automated MongoDB snapshot for Yaans.lk marketplace ($(date -u)). Contains all collections (users, sellers, products, categories, orders, suborders, settlements, and platform settings)." \
            --prerelease || echo "Release creation skipped or non-fatal."

      - name: Summary Report
        run: |
          echo "### 📦 Yaans.lk Database Backup Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** \`${{ env.TIMESTAMP }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Archive File:** \`${{ env.ZIP_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Retention:** 90 Days in GitHub Actions Artifacts + Permanent GitHub Release" >> $GITHUB_STEP_SUMMARY
          echo "- **Cost:** \$0.00 (Free GitHub Actions & Storage)" >> $GITHUB_STEP_SUMMARY
