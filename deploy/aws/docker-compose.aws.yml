version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: yaans_mongodb
    restart: always
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"

  backend:
    build:
      context: ../../backend
    container_name: yaans_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      USE_EXTERNAL_MONGO: "true"
      MONGODB_URI: mongodb://mongodb:27017/yaans_lk
      JWT_SECRET: ${JWT_SECRET:-yaans_lk_production_secret}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      - mongodb
    ports:
      - "127.0.0.1:5000:5000"

volumes:
  mongo_data:
